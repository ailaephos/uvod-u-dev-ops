name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  packages: write
  
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ticketing
          POSTGRES_USER: ticketing_user
          POSTGRES_PASSWORD: change_me_local
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticketing_user -d ticketing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Create security reports directory
        run: mkdir -p docs/security

      - name: Scan K8s manifests
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: k8s/
          severity: HIGH,CRITICAL
          exit-code: '0'
          format: table
          output: docs/security/trivy-k8s-manifests-report.txt
          trivyignores: .trivyignore.yaml

      - name: Build api image
        run: docker build -t ticketing-api:ci ./api

      - name: Smoke test api image
        run: |
          docker run -d --name api-smoke --network host \
            -e API_PORT=8080 \
            -e REDIS_HOST=localhost -e REDIS_PORT=6379 \
            -e POSTGRES_HOST=localhost -e POSTGRES_PORT=5432 \
            -e POSTGRES_DB=ticketing -e POSTGRES_USER=ticketing_user -e POSTGRES_PASSWORD=change_me_local \
            ticketing-api:ci
          sleep 3
          curl -f http://localhost:8080/healthz || (docker logs api-smoke && exit 1)
          curl -f http://localhost:8080/readyz || (docker logs api-smoke && exit 1)
          docker rm -f api-smoke

      - name: Scan api image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ticketing-api:ci
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: table
          output: docs/security/trivy-api-report.txt

      - name: Build worker image
        run: docker build -t ticketing-worker:ci ./worker

      - name: Scan worker image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ticketing-worker:ci
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: table
          output: docs/security/trivy-worker-report.txt

      - name: Build frontend image
        run: docker build -t ticketing-frontend:ci ./frontend

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ticketing-frontend:ci
          severity: CRITICAL,HIGH
          exit-code: '1'
          format: table
          output: docs/security/trivy-frontend-report.txt

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push images
        if: github.event_name == 'push'
        run: |
          TAG=${GITHUB_SHA::7}
          for svc in api worker frontend; do
            docker tag ticketing-$svc:ci ghcr.io/${{ github.repository }}/ticketing-$svc:$TAG
            docker tag ticketing-$svc:ci ghcr.io/${{ github.repository }}/ticketing-$svc:latest
            docker push ghcr.io/${{ github.repository }}/ticketing-$svc:$TAG
            docker push ghcr.io/${{ github.repository }}/ticketing-$svc:latest
          done

      - name: Update k8s manifests with new image tag
        if: github.event_name == 'push'
        run: |
          TAG=${GITHUB_SHA::7}
          for svc in api worker frontend; do
            sed -i -E "s|(ticketing-$svc:)[^[:space:]]+|\1$TAG|" k8s/$svc/deployment.yaml
          done
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/api/deployment.yaml k8s/worker/deployment.yaml k8s/frontend/deployment.yaml
          git diff --cached --quiet || git commit -m "Update k8s image tags to $TAG [skip ci]"
          git push || true

      - name: Commit security reports
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/security/ || true
          git diff --cached --quiet || git commit -m "Update Trivy security reports [skip ci]"
          git push || true